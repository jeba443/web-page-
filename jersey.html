<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Website Layout</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .color-box {
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 30px 0;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }
    footer {
      background-color: #212529;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Navbar</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              Dropdown
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><a class="dropdown-item" href="#">Something else</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li>
        </ul>

        <!-- Search Form -->
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-4">
    <div class="row g-3 text-center">
      <div class="col-4"><div class="color-box bg-success">1</div></div>
      <div class="col-4"><div class="color-box bg-primary">2</div></div>
      <div class="col-4"><div class="color-box bg-danger">3</div></div>

      <div class="col-4"><div class="color-box bg-warning text-dark">4</div></div>
      <div class="col-4"><div class="color-box bg-primary">5</div></div>
      <div class="col-4"><div class="color-box bg-info text-dark">6</div></div>

      <div class="col-6"><div class="color-box bg-secondary">7</div></div>
      <div class="col-6"><div class="color-box bg-primary">8</div></div>

      <div class="col-6"><div class="color-box bg-light text-dark border">9</div></div>
      <div class="col-6"><div class="color-box bg-dark">10</div></div>

      <div class="col-12"><div class="color-box bg-danger">11</div></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <h5>This is Footer</h5>
    <p>Copyright @2024</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
